name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q app.py teamday tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check browser script
        run: node --check static/app.js
      - name: Check clean release package
        run: python scripts/check_release.py
  sdk-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Feishu SDK
        run: python -m pip install -r requirements-feishu.txt
      - name: Import listener
        run: python -c "import lark_oapi; from teamday.listener import listen; print('SDK import OK')"
